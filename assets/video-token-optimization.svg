<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="340" rx="16" fill="#0B1120" stroke="#1E293B"/>
  <text x="48" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">
    Video Token Optimization: Constant 1 FPS vs. Voice-Gated Frame Streaming
  </text>
  <text x="48" y="78" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">
    Gemini 3.8 Live includes all video frames in turns by default; gating frames by voice activity cuts idle token burn.
  </text>

  <text x="48" y="136" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">
    Constant 1 FPS Stream (60 frames / min even while silent)
  </text>
  <rect x="48" y="152" width="640" height="40" rx="8" fill="#EF4444" fill-opacity="0.75"/>
  <text x="368" y="177" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">100% Video Frame Token Consumption</text>

  <text x="48" y="232" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">
    Voice-Gated 1 FPS Stream (Sends JPEG only during active speech window)
  </text>
  <rect x="48" y="248" width="230" height="40" rx="8" fill="#059669"/>
  <text x="163" y="273" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">~65% Fewer Idle Frames</text>
</svg>
